<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Shield background -->
  <path d="M32 4 L58 16 L58 36 C58 50 32 62 32 62 C32 62 6 50 6 36 L6 16 Z"
        fill="#e8f5fb" stroke="#1a6b8a" stroke-width="3"/>
  <!-- Syringe barrel -->
  <rect x="28" y="20" width="8" height="18" rx="2" fill="none" stroke="#1a6b8a" stroke-width="2.5"/>
  <!-- Plunger rod -->
  <line x1="32" y1="38" x2="32" y2="44" stroke="#1a6b8a" stroke-width="2.5"/>
  <!-- T-handle -->
  <line x1="26" y1="44" x2="38" y2="44" stroke="#1a6b8a" stroke-width="2.5"/>
  <!-- Needle -->
  <line x1="32" y1="20" x2="32" y2="14" stroke="#1a6b8a" stroke-width="2"/>
  <!-- Liquid inside barrel -->
  <rect x="30" y="26" width="4" height="10" rx="1" fill="#22a0cc" opacity="0.5"/>
  <!-- Dose lines on barrel -->
  <line x1="28" y1="28" x2="31" y2="28" stroke="#1a6b8a" stroke-width="1.2" opacity="0.6"/>
  <line x1="28" y1="32" x2="31" y2="32" stroke="#1a6b8a" stroke-width="1.2" opacity="0.6"/>
</svg>
